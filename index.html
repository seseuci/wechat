<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SESE @ UCI WeChat</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      text-align: center;
    }

    .container {
      padding: 40px 20px;
    }

    h1 {
      font-size: 36px;
      margin: 0 0 10px;
    }

    p {
      font-size: 18px;
      color: #666;
      margin-bottom: 30px;
    }

    img {
      width: min(450px, 90vw);
      height: auto;
      border-radius: 18px;
    }

    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>SESE @ UCI</h1>

    <p>Scan with WeChat to join our community.</p>

    <img src="wechat-qr.jpg"
         alt="SESE @ UCI WeChat Group QR Code">

    <div class="note">
      WeChat group QR codes may expire. This page will always display the latest QR code.
    </div>

  </div>

</body>
</html>
